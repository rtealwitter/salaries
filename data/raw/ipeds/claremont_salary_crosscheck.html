

<!DOCTYPE html>
<html>
<head>
    <title>Verifying...</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        #blocking-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            font-family: sans-serif;
        }
        .widget-container { margin-top: 20px; }
    </style>
</head>
<body>
    <div id="blocking-overlay">
        <p>Verifying your connection...</p>

        <div class="widget-container">
                <!-- Cloudflare Turnstile Widget -->
                <!-- Replace DATA-SITEKEY with your actual Turnstile Site Key -->
                <div class="cf-turnstile" 
                    data-sitekey="0x4AAAAAAFPsdYxqSVoCs9TH" 
                    data-callback="verifyToken"></div>
        </div>
    </div>

    

   <script>
        // This function triggers automatically when the user passes the challenge
        function verifyToken(token) {
            // Send the token to the backend for server-side verification
            fetch('https://www.univstats.com/secure_connection/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'cf-turnstile-response=' + encodeURIComponent(token)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = "https://www.univstats.com" + data.redirect;
                } else {
                    alert('Verification failed. Please refresh and try again.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred during verification. Please refresh and try again.');
            });
        }
    </script>
</body>
</html>
